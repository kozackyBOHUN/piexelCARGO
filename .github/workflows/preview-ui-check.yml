name: Preview Pixel UI / Regression
on:
  push:
    branches:
      - feat/preview-restart-control
      - feat/preview-gameplay-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, unit tests, production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.preview.config.ts
